services:
    postgres:
        image: postgres:17-alpine
        container_name: radiator-store-db
        restart: unless-stopped
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: store_user
            POSTGRES_PASSWORD: store_pass
            POSTGRES_DB: radiator_store
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U store_user -d radiator_store']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    pgdata:
